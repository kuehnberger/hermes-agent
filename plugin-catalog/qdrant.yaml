sha: 8b2b0f88c326b1753c1f686e26d2ea53d8c6fd4b
version: "0.1.8"
image: https://raw.githubusercontent.com/kuehnberger/hermes-qdrant-memory/8b2b0f88c326b1753c1f686e26d2ea53d8c6fd4b/docs/banner.jpg
description: "Dense semantic memory for Hermes, stored in a Qdrant collection you host. Each turn becomes one point — user and assistant text verbatim, no LLM summarization step — embedded on-device at 384 dimensions with fastembed (ONNX; the default install is 206 MB of runtime dependencies with no torch, versus ~1.2 GB when sentence-transformers was a hard dependency) and recalled by cosine search with an optional session_id payload filter, so a result quotes what was actually said. Registers 7 tools: qdrant_search, qdrant_upsert, qdrant_recall, qdrant_collect, qdrant_prepare, qdrant_forget (point-targeted deletion, dry-run by default, no delete-all), and md_search (local markdown knowledge index). An optional display level (off/summary/verbose) reports recall latency, store latency, point counts, and circuit breaker status in the CLI. sentence-transformers is selectable on GPU hosts; both backends produce identical vectors for all-MiniLM-L6-v2, so switching backends needs no re-embedding. A circuit breaker (5 consecutive I/O failures, 120 s cooldown) degrades to no new memories instead of crashing, and is_available()/check_backend()/unavailable_reason() distinguish a misconfiguration from a dead server. Optional hybrid dense+sparse RRF search: one config key enables dense+BM25 AND sparse RRF search (default off, if turned on, it creates a separate collection with sparse vectors — existing stores stay dense-only); measured +0.024 recall@10 on the LongMemEval 1,000-example benchmark. Local embedded Qdrant mode is not supported: the provider is REST-only and needs a reachable server. Disclosure — all memory content (verbatim user and assistant turns) is stored in and read back from the Qdrant server at the configured url (default http://localhost:6333); QDRANT_API_KEY is only needed for Qdrant Cloud, is kept in .env and read through the Hermes secret scope, and is never written to config.yaml or qdrant.json. Disclosure — the only other outbound traffic is a one-time download of the embedding model weights from huggingface.co (fastembed falls back to storage.googleapis.com/qdrant-fastembed if that fails); embedding runs on-device and no memory content goes to any other party. Disclosure — settings are stored in <HERMES_HOME>/qdrant.json (created 0600, no credentials) and last-operation status in <HERMES_HOME>/qdrant-status.json. Disclosure — md_search reads local markdown OUTSIDE the plugin's own data: ~/.hermes/skills, the Obsidian vault at ~/Documents/hermes_default, the hermes-agent website docs, plus any path set in the md_docs_roots config key; it indexes file content locally and never sends it anywhere. Its vectors live in a SEPARATE hermes_md_docs collection with its own multilingual model (paraphrase-multilingual-MiniLM-L12-v2, downloaded from huggingface.co on first use), carry no session scope and are never queried against memory vectors. Its FTS5 index and ingest state live in <HERMES_HOME>/state/md-search/, outside the plugin directory. Disclosure — the plugin is not a server and registers no MCP server, but it is loaded in-process into every Hermes process that embeds, so each one pays its own model copy: measured 211 MB for a single process and ~194-197 MB marginal for each additional concurrent one (5 concurrent = 1,071 MB resident)."
maintainer: kuehnberger
tier: community
category: memory
requires_hermes: ">=0.21.5"
docs_url: https://github.com/kuehnberger/hermes-qdrant-memory#readme
known_issues:
- "Windows on ARM is unsupported: grpcio, pulled in by qdrant-client, has no win_arm64 wheel. Linux and macOS on x86_64/arm64 and Windows x86_64 are supported."
- "Local embedded Qdrant mode is not supported — the provider is REST-only and requires a reachable server."
- "md_search returns 'no markdown index yet' until you run the bundled ingest script once (python scripts/md_ingest.py, lexical only and fast; add --semantic for the embedding tier, which takes about 7 minutes for 5500 chunks on a 5-core CPU). No background process does this for you."
- "Running the plugin's pytest suite inside an installed copy still changes the PM dependency stamp (the .pytest_cache directory is hashed as a build input); only an upstream core change can exclude gitignored state."
capabilities:
  provides_tools:
  - qdrant_search
  - qdrant_upsert
  - qdrant_recall
  - qdrant_collect
  - qdrant_prepare
  - qdrant_forget
  - md_search
  provides_hooks: []
  provides_middleware: []
  requires_env: []
